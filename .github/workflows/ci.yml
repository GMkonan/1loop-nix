name: Nix checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Formatting
        run: nix fmt -- --check flake.nix nix/*.nix
      - name: Evaluate all supported systems
        run: nix flake check --no-build --all-systems
      - name: Build and test x86_64 packages
        run: nix flake check -L --cores 2 --max-jobs 1
      - name: CLI smoke checks
        run: |
          nix run . -- -help
          nix run .#1loop-server -- -help
