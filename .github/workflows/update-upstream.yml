name: Update upstream

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-upstream
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: cachix/install-nix-action@v31
      - name: Update only the upstream source lock
        run: nix flake update upstream
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Evaluate all supported systems
        if: steps.changes.outputs.changed == 'true'
        run: nix flake check --no-build --all-systems
      - name: Build and test before proposing the update
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix flake check -L --cores 2 --max-jobs 1
          nix run . -- -help
          nix run .#1loop-server -- -help
      - name: Open or update a pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: automation/update-upstream
          delete-branch: true
          add-paths: flake.lock
          commit-message: "chore: update 1loop upstream"
          title: "chore: update 1loop upstream"
          body: |
            Update the pinned source from Feur-Inc/1loop main.

            x86_64 desktop/server builds, update tests, CLI smoke checks and
            evaluation of both supported architectures passed before opening
            this PR. Native GUI and AArch64 execution are not tested here.

            nixpkgs is intentionally unchanged. Auto-merge is enabled only
            after the required Nix checks pass. Consumers still need to
            update their own lock and apply their configuration.
      # GitHub requires approval for PR workflows opened by GITHUB_TOKEN.
      # Approve only this workflow's own tested lock-update PR, never other PRs.
      - name: Start required pull-request checks
        if: steps.changes.outputs.changed == 'true' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          for attempt in {1..12}; do
            echo "Waiting for pull-request CI registration ($attempt/12)"
            run=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
              -f event=pull_request -f head_sha="$PR_HEAD" -f per_page=30 \
              --jq ".workflow_runs | map(select(any(.pull_requests[]; .number == $PR_NUMBER))) | first // empty")
            if [ -n "$run" ]; then
              run_id=$(jq -r '.id' <<< "$run")
              conclusion=$(jq -r '.conclusion' <<< "$run")
              if [ "$conclusion" = action_required ]; then
                gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/approve"
              fi
              exit 0
            fi
            sleep 5
          done
          echo "::error::No pull-request CI run found for the tested update head $PR_HEAD"
          exit 1
      - name: Enable auto-merge for the tested lock update
        if: steps.changes.outputs.changed == 'true' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD"
